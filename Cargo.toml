[package]
name = "rs_chardet"
version = "0.6.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rs_chardet"
crate-type = ["cdylib"]

[dependencies]
chardetng = "1.0.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
